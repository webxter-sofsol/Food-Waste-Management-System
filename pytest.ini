[pytest]
DJANGO_SETTINGS_MODULE = buffet_system.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --reuse-db
testpaths = 
    authentication/tests
    food_listings/tests
    matching/tests
    volunteers/tests
    tracking/tests
    admin_dashboard/tests
    safety_analytics/tests
markers =
    unit: Unit tests
    integration: Integration tests
    property: Property-based tests
    slow: Slow running tests
